name: Deploy CV

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Strona to gotowe HTML-e + CSS — nic nie jest generowane.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html en.html style.css _site/

      # PDF-y powstają przez wydruk tych samych stron (Chrome jest na runnerze).
      - name: Print PDFs
        run: |
          chrome() {
            google-chrome --headless=new --disable-gpu --no-sandbox \
              --no-pdf-header-footer --virtual-time-budget=3000 "$@"
          }
          chrome --print-to-pdf="$PWD/_site/Patryk_Jaseniuk_CV_PL.pdf" \
            "file://$PWD/_site/index.html"
          chrome --print-to-pdf="$PWD/_site/Patryk_Jaseniuk_CV_EN.pdf" \
            "file://$PWD/_site/en.html"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
